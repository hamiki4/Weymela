name: Weymela Android V3 unsigned validation
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/android-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: android-v3-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: '24' }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '21' }
      - name: Locked Android tooling and transport tests
        working-directory: mobile
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm test
      - name: Reuse immutable Production V3 Web assets
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_PACKAGES_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull ghcr.io/hamiki4/weymela-v3-web@sha256:4fdd9525c0c6f968e9e767179feef0f98181086d3c3de31116b6e96a84c30fa4
          python3 mobile/prepare-assets.py
      - name: Existing Production Firebase Android configuration
        env:
          FIREBASE_ANDROID_PUBLIC_JSON: ${{ vars.WEYMELA_PRODUCTION_ANDROID_FIREBASE_JSON }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          c=json.loads(os.environ['FIREBASE_ANDROID_PUBLIC_JSON'])
          assert c['project_info']['project_id']=='weymela-production'
          assert sum(x.get('client_info',{}).get('android_client_info',{}).get('package_name')=='com.weymela.app' for x in c['client'])==1
          p=Path('mobile/android/app/google-services.json')
          p.write_text(json.dumps(c));p.chmod(0o600)
          PY
      - name: Sync recovered native shell
        working-directory: mobile
        run: npx cap sync android
      - name: Android SDK and unsigned release compilation
        working-directory: mobile/android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest bundleRelease -PweymelaUnsignedValidation=true -PweymelaVersionCode=14
          test -f app/build/outputs/bundle/release/app-release.aab
      - name: Verify unsigned AAB metadata and Production configuration
        run: |
          curl --fail --location --silent --show-error https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/weymela-bundletool.jar"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$RUNNER_TEMP/weymela-bundletool.jar" | sha256sum --check
          python3 mobile/inspect-bundle.py mobile/android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/weymela-bundletool.jar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weymela-v3-production-code14-unsigned-validation
          retention-days: 14
          if-no-files-found: error
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/bundle/release/*.verification.json
            mobile/android/app/build/test-results/testReleaseUnitTest/*.xml
