name: Weymela verified image transport
run-name: Transfer verified images from passed release ${{ inputs.source_release_run }}
on:
  workflow_dispatch:
    inputs:
      source_release_run:
        description: Completed successful immutable release run to transport
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { persist-credentials: false }
      - name: Copy exact verified OCI blobs, without build, push or deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RELEASE_RUN: ${{ inputs.source_release_run }}
        run: python3 tools/ci/export-verified-images.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-images-${{ inputs.source_release_run }}
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
          path: |
            .artifacts/image-transfer/verified-images.oci.tar
            .artifacts/image-transfer/transfer-manifest.json
