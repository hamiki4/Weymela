set $weymela_api http://api:8080;
proxy_pass $weymela_api;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $weymela_scheme;
# The edge overwrites this too; never append an untrusted client-supplied chain.
proxy_set_header X-Forwarded-For $http_x_forwarded_for;
proxy_http_version 1.1;
proxy_connect_timeout 5s;
proxy_read_timeout 35s;
proxy_request_buffering on;
proxy_buffering off;
proxy_no_cache 1;
proxy_cache_bypass 1;
