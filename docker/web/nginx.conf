worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not record URI/query, Authorization, cookies, bodies or raw QR tokens.
    log_format bounded '$time_iso8601 $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout bounded;
    server_tokens off;
    client_max_body_size 32k;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Only the approved host TLS edge can reach the loopback listener. It must overwrite this header.
    map $http_x_forwarded_proto $weymela_scheme { default http; https https; }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        include /etc/nginx/weymela-security-headers.conf;
        location = /health/live { access_log off; default_type text/plain; return 200 'ok'; }
        location /api/ {
            set $weymela_api http://api:8080;
            proxy_pass $weymela_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $weymela_scheme;
            # The edge overwrites this too; never append an untrusted client-supplied chain.
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }
        location = /health/ready {
            set $weymela_api http://api:8080;
            proxy_pass $weymela_api;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            access_log off;
        }
        location ^~ /assets/ {
            include /etc/nginx/weymela-security-headers.conf;
            add_header Cache-Control 'public, max-age=31536000, immutable' always;
            try_files $uri =404;
        }
        location ~ /\. { deny all; }
        location / {
            include /etc/nginx/weymela-security-headers.conf;
            add_header Cache-Control 'no-cache' always;
            try_files $uri $uri/ /index.html;
        }
    }
}
