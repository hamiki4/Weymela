# Include inside the canonical pilot.weymela.com HTTPS server.
# Inherits its existing trusted forwarding headers; no Production installation.
# Keep these exact route lists aligned with docker/web/nginx.conf. The canonical
# `/api/` location must not use `^~`, so these bounded regex locations can win.
location ~ ^/api/creator/(creator-budgets/[^/]+/content/review|ugc/assignments/[^/]+/submit-review)$ {
    client_max_body_size 101m;
    proxy_request_buffering off;
    error_page 413 = @pilot_review_media_too_large;
    proxy_pass http://127.0.0.1:18080;
}
location @pilot_review_media_too_large {
    default_type application/json;
    return 413 '{"code":"RequestTooLarge","message":"Review media must be 100 MB or smaller."}';
}
location ~ ^/api/(business/deposit-requests|creator/photo)$ {
    client_max_body_size 5m;
    error_page 413 = @pilot_image_too_large;
    proxy_pass http://127.0.0.1:18080;
}
location @pilot_image_too_large {
    default_type application/json;
    return 413 '{"code":"RequestTooLarge","message":"Image must be 4 MB or smaller."}';
}
