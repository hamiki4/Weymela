# Canonical Pilot browser edge. Install only after backing up the active sites
# and validating with `nginx -t`. V3 remains the authority service; V2 remains
# the product service. The integration issuer is deliberately unchanged.

server {
    listen 80;
    listen [::]:80;
    server_name pilot.weymela.com;
    return 308 https://pilot.weymela.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pilot.weymela.com;

    ssl_certificate /etc/letsencrypt/live/pilot.weymela.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilot.weymela.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    client_max_body_size 32m;

    # V2 API and realtime transport have the more-specific public prefixes.
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:28080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location = /_weymela_product_session {
        internal;
        proxy_pass http://127.0.0.1:28080/api/v1/integration/v3/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ^~ /hubs/ {
        proxy_pass http://127.0.0.1:28080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # Every other /api route belongs to V3 and retains V3's Web-to-API proxy.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # V3 and V2 both publish /assets. V3 HTML is rewritten to this private
    # static prefix; the upstream URI is restored before the V3 Web container.
    location ^~ /v3-static/ {
        rewrite ^/v3-static/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }

    # V3 authentication, account, recovery, legal, and handoff browser routes.
    location = / { error_page 418 = @v3_web; return 418; }
    location = /sign-in { error_page 418 = @v3_web; return 418; }
    location = /pin-setup { error_page 418 = @v3_web; return 418; }
    location = /security-setup { error_page 418 = @v3_web; return 418; }
    location = /onboarding { error_page 418 = @v3_web; return 418; }
    location = /product-handoff { error_page 418 = @v3_web; return 418; }
    location = /integration/sign-out { error_page 418 = @v3_web; return 418; }
    location = /legal/terms-of-service { error_page 418 = @v3_web; return 418; }
    location = /legal/privacy-policy { error_page 418 = @v3_web; return 418; }
    location = /unauthorized { error_page 418 = @v3_web; return 418; }
    location = /favicon-16.png { error_page 418 = @v3_web; return 418; }
    location = /favicon-32.png { error_page 418 = @v3_web; return 418; }
    location ^~ /brand/ { error_page 418 = @v3_web; return 418; }
    location ^~ /legal/ { error_page 418 = @v3_web; return 418; }

    # Product routes use V2 only when its protected session is validated by the
    # V2 API. Otherwise enter only the V3 role root so authority is revalidated
    # and a fresh handoff is issued. Legacy V3 sub-pages can never render here.
    location = /admin {
        auth_request /_weymela_product_session;
        error_page 401 = @v3_admin_entry;
        proxy_pass http://127.0.0.1:28081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /admin/ {
        auth_request /_weymela_product_session;
        error_page 401 = @admin_root;
        proxy_pass http://127.0.0.1:28081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /creator {
        auth_request /_weymela_product_session;
        error_page 401 = @v3_creator_entry;
        proxy_pass http://127.0.0.1:28081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /creator/ {
        auth_request /_weymela_product_session;
        error_page 401 = @creator_root;
        proxy_pass http://127.0.0.1:28081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /business {
        auth_request /_weymela_product_session;
        error_page 401 = @v3_business_entry;
        proxy_pass http://127.0.0.1:28081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /business/ {
        auth_request /_weymela_product_session;
        error_page 401 = @business_root;
        proxy_pass http://127.0.0.1:28081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /shopper {
        auth_request /_weymela_product_session;
        error_page 401 = @customer_entry;
        proxy_pass http://127.0.0.1:28081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /shopper/ {
        auth_request /_weymela_product_session;
        error_page 401 = @shopper_root;
        proxy_pass http://127.0.0.1:28081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /customer/offers {
        auth_request /_weymela_product_session;
        error_page 401 = @v3_customer_entry;
        error_page 403 = @v3_customer_entry;
        proxy_pass http://127.0.0.1:28081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/onboarding/(customer|creator|business)(?:/|$) {
        auth_request /_weymela_product_session;
        error_page 401 = @onboarding_root;
        proxy_pass http://127.0.0.1:28081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @admin_root { return 303 /admin; }
    location @creator_root { return 303 /creator; }
    location @business_root { return 303 /business; }
    location @shopper_root { return 303 /shopper; }
    location @customer_entry { return 303 /customer/offers; }
    location @onboarding_root { return 303 /onboarding; }
    location @v3_admin_entry { rewrite ^ /admin break; proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Port 443; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Accept-Encoding ""; sub_filter_once off; sub_filter '"/assets/' '"/v3-static/assets/'; }
    location @v3_creator_entry { rewrite ^ /creator break; proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Port 443; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Accept-Encoding ""; sub_filter_once off; sub_filter '"/assets/' '"/v3-static/assets/'; }
    location @v3_business_entry { rewrite ^ /business break; proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Port 443; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Accept-Encoding ""; sub_filter_once off; sub_filter '"/assets/' '"/v3-static/assets/'; }
    location @v3_customer_entry { rewrite ^ /customer/offers break; proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Port 443; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Accept-Encoding ""; sub_filter_once off; sub_filter '"/assets/' '"/v3-static/assets/'; }
    location @v3_web { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Port 443; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Connection ""; proxy_set_header Accept-Encoding ""; sub_filter_once off; sub_filter '"/assets/' '"/v3-static/assets/'; }

    # V2 owns the canonical PWA, shared static assets, public/product pages,
    # and all other product navigation.
    location / {
        proxy_pass http://127.0.0.1:28081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
}

# Existing API hostname remains as a temporary compatibility endpoint.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api-pilot.weymela.com;
    ssl_certificate /etc/letsencrypt/live/pilot.weymela.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilot.weymela.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:28080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api-pilot.weymela.com;
    return 308 https://api-pilot.weymela.com$request_uri;
}
