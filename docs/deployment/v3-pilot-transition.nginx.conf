# Temporary compatibility entry. Keep DNS/TLS in place during acceptance while
# sending every browser route to the canonical single-origin Pilot.

server {
    listen 80;
    listen [::]:80;
    server_name v3-pilot.weymela.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://pilot.weymela.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name v3-pilot.weymela.com;

    ssl_certificate /etc/letsencrypt/live/v3-pilot.weymela.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v3-pilot.weymela.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        return 308 https://pilot.weymela.com$request_uri;
    }
}
